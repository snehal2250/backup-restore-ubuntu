# =============================================================================
# inventory.yaml — THE single source of truth for this repo.
#
# This file is hand-maintained (via ./inventory.sh or directly). It declares ONLY
# the main apps, packages, services and dotfiles the user installed on top of
# stock Ubuntu. Dependencies of an app belong in that app's `depends_apt` — never
# here as separate entries. No versions anywhere: restore always installs the
# latest stable from the recommended source.
#
# VALIDATION: this file is checked against the VERSIONED JSON Schema in
# inventory/schema.yaml (structural, via lib/schema_check.py — a real
# validator) plus semantic checks in lib/common.sh validate_inventory()
# (unique names, path ownership overlaps, default_shell provenance, installer
# template completeness, ...). Run: ./inventory.sh validate. `schema_version`
# MUST equal the version the schema file implements; bump both together when
# the contract changes.
#
# Editing rules (see AGENTS.md for the full context):
#   * schema_version / profile -> fixed identity of the file (validated).
#   * apt_packages / snap_packages / flatpak_apps / dotfiles / user_dirs -> one item per line
#   * user_dirs: whole folders the user wants captured (e.g. ~/Documents), '~' form.
#     Unlike app config_paths these are user DATA, not app config — backed up whole.
#   * snap_packages supports the suffix ':classic' (e.g. code:classic)
#   * apps:      EVERY app carries a structured `installer:` block — a typed,
#     parameterized record (NO free-form shell). Optional completeness
#     policies per app/service: `required: true` or `on_missing: fail` make a
#     missing item a hard backup failure (overall status 'failed'); the
#     default `on_missing: warn` degrades the backup instead. The policies
#     apply only to DECLARED paths — an app with no config_paths is recorded
#     'empty' (informational), never 'failed'. The install method is
#     `installer.type` in:
#       apt | snap | snap_classic | flatpak | npm_global | pipx | cargo |
#       apt_repository | deb | tarball | script
#     Package-based types optionally take `installer.package` (defaults to the
#     app name). Download types take `installer.url` (+ checksum/unverified,
#     {arch}/{version} templates, arch gates — see inventory/schema.yaml).
#     `script` is the explicit LAST RESORT: it requires a pinned
#     `installer.checksum` or `installer.unverified: true`.
#     CATALOG REFERENCES (schema v5, optional): instead of a full record an
#     app may be declared as `catalog: <key>` (a template in lib/catalog.sh,
#     e.g. `./inventory.sh add-app gh` emits this) plus an optional
#     `overrides:` partial record. The effective record is the template merged
#     with the overrides at run time (resolve_effective_inventory in
#     lib/common.sh): maps/scalars override the template, arrays (config_paths,
#     exclude, ...) APPEND to it (deduped) — so catalog fixes reach existing
#     entries automatically. `./inventory.sh review --drift` reports how
#     declared entries differ from their templates.
#                config_paths use '~' form and are the ONLY things backed up
#                exclude: optional rsync exclude patterns (one per line) to keep caches,
#                model stores and re-downloadable binaries OUT of the backup
#                extensions: optional list of extension/model IDs to re-install AFTER restore
#                  (VS Code extensions via 'code --install-extension', Azure CLI via
#                  'az extension add', Ollama models via 'ollama pull'). IDs only — no versions.
#                conflict_policy: optional merge|replace|skip-existing|prompt (default merge)
#                  — how restore applies this app's config when the target already has files
#                default_shell: optional (top-level), the login shell to set via chsh
#                  (e.g. /usr/bin/fish). The shell package must be declared as an app.
#   * services:  only CUSTOM services the user installed; target system|user
#                (timer units like foo.timer are declared here too — a timer's
#                paired foo.service should be declared as well, see the pairing
#                check in validate_inventory)
#   * cron_jobs: which cron scheduling the repo manages. source: user = the
#                running user's crontab (crontab -l / crontab <file> — whole-
#                crontab replace with rollback capture at restore); source:
#                cron.d = the file /etc/cron.d/<file> (restored with sudo).
#                The CONTENT lives in the backup — declare only WHICH sources.
#                At most one source: user entry. Names: no dots for cron.d files.
# =============================================================================

schema_version: 6 # must match inventory/schema.yaml (bump both together); 3-5 still validate during the transition
profile: workstation # machine profile, validated against the schema
default_shell: /usr/bin/fish
apt_packages: []
snap_packages: []
flatpak_apps: []
dotfiles: []
# - .bashrc
# - .gitconfig
# - .profile
groups:
  - docker
user_dirs:
  - ~/Documents
  - ~/.config/manicode/projects
apps:
  - name: "opencode"
    description: "AI coding agent (opencode.ai)"
    installer:
      type: script
      url: "https://opencode.ai/install"
      unverified: true
    check_cmd: "opencode"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.config/opencode"
    exclude:
      - "node_modules"
  - name: "code"
    description: "Visual Studio Code"
    installer:
      type: snap_classic
      package: "code"
    check_cmd: "code"
    config_paths:
      - "~/.config/Code"
    exclude:
      - "CachedExtensionVSIXs"
      - "CachedData"
      - "Cache"
      - "WebStorage"
      - "logs"
  - name: "git"
    description: "Git version control (official apt)"
    installer:
      type: apt
    check_cmd: "git"
    config_paths:
      - "~/.gitconfig"
      - "~/.config/git"
    conflict_policy: replace
  - name: "gh"
    description: "GitHub CLI (official apt repo)"
    installer:
      type: apt_repository
      url: "https://cli.github.com/packages"
      suite: "stable"
      components:
        - "main"
      key_url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
      packages:
        - "gh"
    check_cmd: "gh"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.config/gh"
  - name: "gcloud"
    description: "Google Cloud CLI (classic snap)"
    installer:
      type: snap_classic
      package: "google-cloud-cli"
    check_cmd: "gcloud"
    config_paths:
      - "~/.config/gcloud"
    exclude:
      - "logs"
  - name: "go"
    description: "Go toolchain (official go.dev tarball, latest stable)"
    installer:
      type: tarball
      url: "https://go.dev/dl/{version}.linux-{arch}.tar.gz"
      version_url: "https://go.dev/VERSION?m=text"
      checksum_url: "https://go.dev/dl/{version}.linux-{arch}.tar.gz.sha256"
      binary: "go/bin/go"
      dest: "/usr/local"
    check_cmd: "go"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.config/go"
    exclude:
      - "telemetry"
  - name: "uv"
    description: "Python package manager (official installer)"
    installer:
      type: script
      url: "https://astral.sh/uv/install.sh"
      unverified: true
    check_cmd: "uv"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.config/uv"
  - name: "cloudflared"
    description: "Cloudflare Tunnel client (official apt repo)"
    installer:
      type: apt_repository
      url: "https://pkg.cloudflare.com/cloudflared"
      suite: "any"
      components:
        - "main"
      key_url: "https://pkg.cloudflare.com/cloudflare-main.gpg"
      packages:
        - "cloudflared"
    check_cmd: "cloudflared"
    depends_apt:
      - "curl"
  - name: "mongodb-compass"
    description: "MongoDB GUI (official .deb, latest stable)"
    installer:
      type: deb
      url: "https://downloads.mongodb.com/compass/mongodb-compass_{version}_amd64.deb"
      version_url: "https://info-mongodb-com.s3.amazonaws.com/com-download-center/compass.json"
      version_query: ".versions[0]._id"
      arch: "amd64"
      unverified: true
    check_cmd: "mongodb-compass"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.config/MongoDB Compass"
    exclude:
      - "Cache"
      - "GPUCache"
      - "DawnWebGPUCache"
      - "DawnGraphiteCache"
  - name: "google-chrome"
    description: "Google Chrome web browser (official .deb)"
    installer:
      type: deb
      url: "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
      arch: "amd64"
      unverified: true
    check_cmd: "google-chrome"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.config/google-chrome"
    exclude:
      - "optimization_guide_model_store"
      - "component_crx_cache"
      - "WasmTtsEngine"
      - "Safe*Browsing"
      - "OnDeviceHeadSuggestModel"
      - "GPUPersistentCache"
      - "Crashpad"
      - "GPUCache"
      - "Singleton*" # runtime singletons (SingletonSocket/Lock/Cookie) while Chrome runs
  - name: "fish"
    description: "Friendly interactive shell (official apt)"
    installer:
      type: apt
    check_cmd: "fish"
    config_paths:
      - "~/.config/fish"
  - name: "sqlitebrowser"
    description: "DB Browser for SQLite (official apt)"
    installer:
      type: apt
    check_cmd: "sqlitebrowser"
    config_paths:
      - "~/.config/sqlitebrowser"
  - name: "freebuff"
    description: "Freebuff AI coding assistant CLI (npm)"
    installer:
      type: npm_global
    check_cmd: "freebuff"
    depends_apt:
      - "nodejs"
      - "npm"
    config_paths:
      - "~/.config/manicode"
    exclude:
      - "projects"
      - "freebuff"
      - "rg"
      - "tree-sitter.wasm"
  - name: "docker"
    description: "Docker Engine + CLI (official Docker apt repo)"
    installer:
      type: apt_repository
      url: "https://download.docker.com/linux/ubuntu"
      suite: "codename"
      components:
        - "stable"
      key_url: "https://download.docker.com/linux/ubuntu/gpg"
      key_fingerprint: "9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88"
      packages:
        - "docker-ce"
        - "docker-ce-cli"
        - "containerd.io"
        - "docker-buildx-plugin"
        - "docker-compose-plugin"
    check_cmd: "docker"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.docker"
    exclude:
      - "cli-plugins"
  - name: "tmux"
    description: "Terminal multiplexer (apt)"
    installer:
      type: apt
    check_cmd: "tmux"
    config_paths:
      - "~/.tmux.conf"
    conflict_policy: skip-existing
  - name: "terraform"
    description: "HashiCorp Terraform IaC CLI"
    installer:
      type: snap_classic
    check_cmd: "terraform"
    config_paths:
      - "~/.terraform.d"
    exclude:
      - "checkpoint_cache"
      - "checkpoint_signature"
  - name: "ollama"
    description: "Local LLM runner (snap)"
    installer:
      type: snap
    check_cmd: "ollama"
    extensions:
      - "llama3.2"
  - name: "az"
    description: "Microsoft Azure CLI (official MS apt repo)"
    installer:
      type: apt_repository
      url: "https://packages.microsoft.com/repos/azure-cli"
      suite: "codename"
      components:
        - "main"
      key_url: "https://packages.microsoft.com/keys/microsoft.asc"
      packages:
        - "azure-cli"
    check_cmd: "az"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.azure"
    exclude:
      - "cliextensions"
      - "logs"
      - "telemetry"
      - "commands"
    extensions:
      - "azure-devops"
  - name: "azurite"
    description: "Azure Storage emulator (npm)"
    installer:
      type: npm_global
    check_cmd: "azurite"
    depends_apt:
      - "nodejs"
      - "npm"
  - name: "slack"
    description: "Slack desktop (snap)"
    installer:
      type: snap
    check_cmd: "slack"
  - name: "onlyoffice"
    description: "OnlyOffice desktop editors (snap)"
    installer:
      type: snap
      package: "onlyoffice-desktopeditors"
    check_cmd: "onlyoffice-desktopeditors"
  - name: "storage-explorer"
    description: "Azure Storage Explorer (snap)"
    installer:
      type: snap
    check_cmd: "storage-explorer"
  - name: "tailscale"
    description: "Tailscale mesh VPN (official installer)"
    installer:
      type: script
      url: "https://tailscale.com/install.sh"
      unverified: true
    check_cmd: "tailscale"
    depends_apt:
      - "curl"
services:
  - unit: "cloudflared.service"
    target: system
    enable: true
    start: true
    config_paths:
      - "/etc/cloudflared/config.yml"
      - "~/.cloudflared"
  - unit: "cloudflared-update.service"
    target: system
    enable: false
    start: false
  # Dogfood: cloudflared's daily update TIMER (same pattern as the trading-bot
  # timers below — the timer is the enabled/started entry point; the paired
  # cloudflared-update.service is pulled in by the timer, so it stays
  # enable/start false).
  - unit: "cloudflared-update.timer"
    target: system
    enable: true
    start: true
  # Dogfood: the user's systemd user TIMERS (schema v6 formalized .timer units
  # as first-class services entries). The timer is the enabled/started entry
  # point; its paired .service is pulled in by the timer and must NOT be
  # auto-started at restore (it would run the bot immediately), so those are
  # declared with enable/start false.
  - unit: "trading-bot-end-of-day.timer"
    target: user
    enable: true
    start: true
  - unit: "trading-bot-end-of-day.service"
    target: user
    enable: false
    start: false
  - unit: "trading-bot-premium-paper.timer"
    target: user
    enable: true
    start: true
  - unit: "trading-bot-premium-paper.service"
    target: user
    enable: false
    start: false
  - unit: "trading-bot-telegram.timer"
    target: user
    enable: true
    start: true
  - unit: "trading-bot-telegram.service"
    target: user
    enable: false
    start: false
cron_jobs:
  - name: "user-crontab"
    source: user
# Declare WHICH cron sources the repo manages — the CONTENT lives in the backup,
# never here (add with: ./inventory.sh add-cron):
#   - name: user-crontab
#     source: user          # the running user's crontab (crontab -l); at most one
#   - name: my-daily
#     source: cron.d        # the file /etc/cron.d/<file> (restored with sudo)
#     file: my-daily        # /etc/cron.d names must not contain dots
