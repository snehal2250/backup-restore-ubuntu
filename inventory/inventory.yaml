# =============================================================================
# inventory.yaml — THE single source of truth for this repo.
#
# This file is hand-maintained (via ./inventory.sh or directly). It declares ONLY
# the main apps, packages, services and dotfiles the user installed on top of
# stock Ubuntu. Dependencies of an app belong in that app's `depends_apt` — never
# here as separate entries. No versions anywhere: restore always installs the
# latest stable from the recommended source.
#
# Editing rules (see AGENTS.md for the full context):
#   * apt_packages / snap_packages / flatpak_apps / dotfiles  -> one item per line
#   * snap_packages supports the suffix ':classic' (e.g. code:classic)
#   * apps:      install_type in apt|snap|snap-classic|flatpak|npm-global|pipx|cargo|script|custom
#                script/custom requires install_command
#                package: optional apt/snap/flatpak package name if it differs from the app name
#                config_paths use '~' form and are the ONLY things backed up
#   * services:  only CUSTOM services the user installed; target system|user
# =============================================================================

apt_packages:
# - git
# - curl
snap_packages:
# - code:classic
flatpak_apps:
# - org.gimp.GIMP
dotfiles:
# - .bashrc
# - .gitconfig
# - .profile
apps:
  - name: "opencode"
    description: "AI coding agent (opencode.ai)"
    install_type: "script"
    install_command: "curl -fsSL https://opencode.ai/install | bash"
    check_cmd: "opencode"
    depends_apt:
      - "curl"
    config_paths:
      - "~/.config/opencode"
  - name: "code"
    description: "Visual Studio Code"
    install_type: "snap-classic"
    check_cmd: "code"
    config_paths:
      - "~/.config/Code"
  - name: "gh"
    install_type: "snap"
    check_cmd: "gh"
    config_paths:
      - "~/.config/gh"
  - name: "gcloud"
    install_type: "snap"
    check_cmd: "gcloud"
    config_paths:
      - "~/.config/gcloud"
    package: google-cloud-cli
  - name: "go"
    install_type: "apt"
    check_cmd: "go"
    config_paths:
      - "~/.config/go"
    package: golang-go
  - name: "uv"
    install_type: "pipx"
    check_cmd: "uv"
    config_paths:
      - "~/.config/uv"
  - name: "cloudflared"
    description: "Cloudflare Tunnel client (official apt repo)"
    install_type: "custom"
    install_command: "sudo mkdir -p --mode=0755 /usr/share/keyrings && curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null && echo \"deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main\" | sudo tee /etc/apt/sources.list.d/cloudflared.list && sudo apt-get update && sudo apt-get install -y cloudflared"
    check_cmd: "cloudflared"
  - name: "mongodb-compass"
    description: "MongoDB GUI (official .deb, latest stable)"
    install_type: "custom"
    install_command: "DEB=$(curl -fsSL https://info-mongodb-com.s3.amazonaws.com/com-download-center/compass.json | grep -oE 'https://downloads.mongodb.com/compass/mongodb-compass_[0-9.]+_amd64.deb' | head -1) && [ -n \"$DEB\" ] && curl -fsSL -o /tmp/mongodb-compass.deb \"$DEB\" && sudo apt-get install -y /tmp/mongodb-compass.deb"
    check_cmd: "mongodb-compass"
    config_paths:
      - "~/.config/MongoDB Compass"
  - name: "google-chrome"
    description: "Google Chrome web browser"
    install_type: "custom"
    install_command: "wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt-get install -y /tmp/google-chrome.deb"
    check_cmd: "google-chrome"
    config_paths:
      - "~/.config/google-chrome"
