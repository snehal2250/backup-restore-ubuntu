# =============================================================================
# inventory/schema.yaml — versioned JSON Schema (draft 2020-12) for
# inventory/inventory.yaml.
#
# This is the STRUCTURAL contract for the inventory. Every declaration is
# checked against it (with a real validator — lib/schema_check.py on python3 +
# the reference `jsonschema` library) BEFORE any semantic validation or any
# backup/restore step runs.
#
# Versioning: the inventory's `schema_version: N` must equal the version this
# file implements ($id carries it too). Bumping the contract means:
#   1. increment `schema_version` in inventory.yaml AND the `$id` here,
#   2. extend this file, and
#   3. update AGENTS.md / docs to match.
#
# v2 changes: the per-app install method moved from the opaque
# `install_type`/`install_command`/`package` scalars into a single structured
# `installer:` block (see $defs.installer). Apps now declare HOW they are
# installed with typed, parameterized records (apt, snap, snap_classic,
# flatpak, npm_global, pipx, cargo, apt_repository, deb, tarball, script)
# instead of free-form shell pipelines.
#
# Semantic rules that a schema cannot express — unique app/service names,
# default_shell provided by a declared package, overlapping path ownership,
# config nested under an excluded path, {version} URL template completeness,
# supported arch/Ubuntu release — are enforced in validate_inventory() in
# lib/common.sh. This file is structure only.
# =============================================================================
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://backup-restore-ubuntu.local/schema/inventory-v2"
title: "Backup-Restore-Ubuntu inventory schema (v2)"
description: "Structural contract for inventory/inventory.yaml, profile: workstation."

type: object
additionalProperties: false
# All top-level lists are REQUIRED (empty allowed): the scripts read them with
# plain yq expressions like `.apps[]`, so a schema-valid inventory must always
# declare them. The shipped inventory declares every one of them.
required:
  - schema_version
  - profile
  - apt_packages
  - snap_packages
  - flatpak_apps
  - dotfiles
  - groups
  - user_dirs
  - apps
  - services

properties:
  schema_version:
    const: 2
    description: "Must equal the version implemented by this schema file."
  profile:
    enum:
      - workstation
    description: "Machine profile. New profiles bump schema_version."
  default_shell:
    type: [string, "null"]
    pattern: "^/(usr/bin|bin)/[a-zA-Z0-9._-]+$"
    description: "Absolute shell path; its package must be a declared app or apt package (semantic check)."
  apt_packages:
    type: array
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9+.-]*$"
  snap_packages:
    type: array
    items:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*(:classic)?$"
    description: "Entries may carry the ':classic' suffix for classic confinement."
  flatpak_apps:
    type: array
    items:
      type: string
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9.]*$"
    description: "Reverse-DNS app IDs, e.g. org.gimp.GIMP."
  dotfiles:
    type: array
    items:
      type: string
      pattern: "^(?!.*\\.\\.)[a-zA-Z0-9._-]+(/[a-zA-Z0-9._-]+)*$"
    description: "Relative path under $HOME; no leading slash, no '..' traversal."
  groups:
    type: array
    items:
      type: string
      pattern: "^[a-z_][a-z0-9_-]{0,31}$"
  user_dirs:
    type: array
    items:
      type: string
      pattern: "^(?!.*\\.\\.)~/[^\\x00-\\x1f]+$"
    description: "Whole user-data folders; must use the ~/ form, never '~' itself, and never '..'."
  apps:
    type: array
    items:
      $ref: "#/$defs/app"
  services:
    type: array
    items:
      $ref: "#/$defs/service"

$defs:
  app:
    type: object
    additionalProperties: false
    description: "One main application. `installer` declares HOW it is installed; the other keys are the same across all installer types."
    required:
      - name
      - installer
    properties:
      name:
        type: string
        pattern: "^[a-zA-Z0-9._-]+$"
      description:
        type: string
      installer:
        $ref: "#/$defs/installer"
      check_cmd:
        type: string
        pattern: "^[a-zA-Z0-9._-]+$"
        description: "Binary used to verify the app is present (especially for download/script installers)."
      depends_apt:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9][a-z0-9+.-]*$"
        description: "APT packages installed before the app (curl for download types, nodejs/npm for npm, ...)."
      config_paths:
        type: array
        items:
          type: string
          pattern: "^(?!.*\\.\\.)(~|~/[^\\x00-\\x1f]*|/[^\\x00-\\x1f]*)$"
        description: "Exactly '~', '~/...', or an absolute '/...' path; never '~foo' or '..', no control characters. NOTE: a lone '~' must be QUOTED as \"~\" in YAML — bare ~ parses as null."
      exclude:
        type: array
        items:
          type: string
          pattern: "^(?!.*\\.\\.)[^~/][^\\x00-\\x1f]*$"
        description: "Relative rsync patterns (globs allowed); never absolute or '..'-containing."
      extensions:
        type: array
        items:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._@-]*$"
        description: "Extension/model IDs to re-install after restore (VS Code, az, ollama)."

  installer:
    type: object
    additionalProperties: false
    required:
      - type
    description: >
      Structured install record. `type` picks ONE installer function in
      lib/installers.sh; the allowed fields depend on the type (see allOf).
      URL fields may contain `{arch}`; deb/tarball URLs may also contain
      `{version}` (resolved from `version` or `version_url`).
    properties:
      type:
        enum: [apt, snap, snap_classic, flatpak, npm_global, pipx, cargo, apt_repository, deb, tarball, script]
      package:
        type: string
        description: "Source package name when it differs from the app name; package-based types only. The exact pattern depends on the type (see allOf)."
      url:
        type: string
        pattern: "^https://"
        description: "Source URL for apt_repository/deb/tarball/script; may contain {arch} and (deb/tarball) {version}."
      suite:
        type: string
        pattern: "^[^\\x00-\\x1f ]+$"
        description: "apt_repository suite; the literal value 'codename' resolves to the running Ubuntu codename (e.g. noble)."
      components:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9._-]+$"
        description: "apt_repository components. Absent -> ['main']; an explicit empty list means no components."
      key_url:
        type: string
        pattern: "^https://"
        description: "apt_repository signing key URL; downloaded to /etc/apt/keyrings and referenced via signed-by=."
      key_fingerprint:
        type: string
        pattern: "^([A-Fa-f0-9]{4} ){9}[A-Fa-f0-9]{4}$|^[A-Fa-f0-9]{40}$"
        description: "apt_repository (optional): expected GPG key fingerprint, verified with gpg before the key is trusted."
      packages:
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^[a-z0-9][a-z0-9+.-]*$"
        description: "apt_repository: packages to install from the repository."
      arch:
        type: string
        enum: [amd64, arm64]
        description: "deb/tarball: install-gate — restore skips (and flags) the app when the running arch differs. apt_repository: constrains the sources line with arch=."
      checksum:
        type: string
        pattern: "^[a-fA-F0-9]{64}$"
        description: "Optional pinned sha256 of the downloaded artifact (deb/tarball/script)."
      checksum_url:
        type: string
        pattern: "^https://"
        description: "tarball only: URL of a sha256 sidecar file; may contain {arch}/{version}. The first whitespace-separated token is the expected checksum."
      unverified:
        type: boolean
        description: "Explicit acknowledgement that no checksum is pinned. REQUIRED for deb/tarball/script when checksum/checksum_url are absent."
      binary:
        type: string
        pattern: "^(?!.*\\.\\.)[^/][^\\x00-\\x1f]*$"
        description: "tarball: path inside the archive (e.g. go/bin/go) symlinked into /usr/local/bin."
      dest:
        type: string
        pattern: "^/(usr/local|opt)(/.*)?$"
        description: "tarball: extract destination (default /usr/local); must be under /usr/local or /opt."
      version:
        type: string
        pattern: "^[^\\x00-\\x1f&]+$"
        description: "Literal version substituted for {version} in deb/tarball URLs. '&' is forbidden (it would corrupt bash pattern substitution in the URL template)."
      version_url:
        type: string
        pattern: "^https://"
        description: "deb/tarball: URL whose content provides the version for {version} (first non-empty line, or the result of version_query)."
      version_query:
        type: string
        pattern: "^[^\\x00-\\x1f]+$"
        description: "deb/tarball: optional yq expression applied to the version_url document (e.g. .versions[0]._id)."
    allOf:
      # --- package-based types share one allowed-key set -------------------
      - if:
          properties:
            type:
              enum: [apt, snap, snap_classic, flatpak, npm_global, pipx, cargo]
          required: [type]
        then:
          properties:
            url: false
            suite: false
            components: false
            key_url: false
            key_fingerprint: false
            packages: false
            arch: false
            checksum: false
            checksum_url: false
            unverified: false
            binary: false
            dest: false
            version: false
            version_url: false
            version_query: false
      # --- per-source package-name patterns --------------------------------
      - if:
          properties:
            type:
              const: apt
          required: [type]
        then:
          properties:
            package:
              type: string
              pattern: "^[a-z0-9][a-z0-9+.-]*$"
      - if:
          properties:
            type:
              enum: [snap, snap_classic]
          required: [type]
        then:
          properties:
            package:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]*$"
      - if:
          properties:
            type:
              const: flatpak
          required: [type]
        then:
          properties:
            package:
              type: string
              pattern: "^[a-zA-Z0-9][a-zA-Z0-9.]*$"
              description: "Flatpak app IDs are reverse-DNS (e.g. org.gimp.GIMP) and may contain uppercase."
      - if:
          properties:
            type:
              enum: [npm_global, pipx, cargo]
          required: [type]
        then:
          properties:
            package:
              type: string
              pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$"
      # --- apt_repository ---------------------------------------------------
      - if:
          properties:
            type:
              const: apt_repository
          required: [type]
        then:
          required: [url, suite, key_url, packages]
          properties:
            package: false
            checksum: false
            checksum_url: false
            unverified: false
            binary: false
            dest: false
            version: false
            version_url: false
            version_query: false
      # --- deb ---------------------------------------------------------------
      - if:
          properties:
            type:
              const: deb
          required: [type]
        then:
          required: [url]
          properties:
            package: false
            suite: false
            components: false
            key_url: false
            key_fingerprint: false
            packages: false
            checksum_url: false
            binary: false
            dest: false
          allOf:
            - anyOf:
                - required: [checksum]
                - properties:
                    unverified:
                      const: true
                  required: [unverified]
      # --- tarball -------------------------------------------------------------
      - if:
          properties:
            type:
              const: tarball
          required: [type]
        then:
          required: [url]
          properties:
            package: false
            suite: false
            components: false
            key_url: false
            key_fingerprint: false
            packages: false
          allOf:
            - anyOf:
                - required: [checksum]
                - required: [checksum_url]
                - properties:
                    unverified:
                      const: true
                  required: [unverified]
      # --- script (explicit last resort) --------------------------------------
      - if:
          properties:
            type:
              const: script
          required: [type]
        then:
          required: [url]
          properties:
            package: false
            suite: false
            components: false
            key_url: false
            key_fingerprint: false
            packages: false
            checksum_url: false
            arch: false
            binary: false
            dest: false
            version: false
            version_url: false
            version_query: false
          allOf:
            - anyOf:
                - required: [checksum]
                - properties:
                    unverified:
                      const: true
                  required: [unverified]

  service:
    type: object
    additionalProperties: false
    description: "A custom systemd unit the user installed (never a default service)."
    required:
      - unit
    properties:
      unit:
        type: string
        pattern: "^[a-zA-Z0-9@._:-]+\\.(service|timer|socket|path)$"
      target:
        enum: [user, system]
      enable:
        type: boolean
      start:
        type: boolean
      config_paths:
        type: array
        items:
          type: string
          pattern: "^(?!.*\\.\\.)(~|~/[^\\x00-\\x1f]*|/[^\\x00-\\x1f]*)$"
        description: "Exactly '~', '~/...', or an absolute '/...' path; never '~foo' or '..'. NOTE: a lone '~' must be QUOTED as \"~\" in YAML."
